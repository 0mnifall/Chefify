name: chefify

services:
  db:
    image: postgres:17
    container_name: chefify_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chefify_api
    ports:
      - "${BACKEND_HTTP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      S3__BucketName: ${S3_BUCKET_NAME}
      S3__Region: ${S3_REGION}
      S3__AccessKey: ${AWS_ACCESS_KEY_ID}
      S3__SecretKey: ${AWS_SECRET_ACCESS_KEY}
      S3__PresignedUrlMinutes: ${S3_PRESIGNED_URL_MINUTES}
      S3__MaxUploadBytes: ${S3_MAX_UPLOAD_BYTES}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      
  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.41.9}
    image: chefify/frontend-web:${FLUTTER_VERSION:-3.41.9}
    ports:
      - "${FRONTEND_HTTP_PORT:-8088}:80"
    profiles:
      - frontend

  frontend-preview:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_PREVIEW_PORT:-8089}:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./frontend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - frontend-local-build
       
volumes:
  postgres_data:
